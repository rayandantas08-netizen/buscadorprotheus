name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Construir site
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar pnpm globalmente
        run: npm install -g pnpm@10.4.1

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Construir site estático
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          REPO_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          BASE_PATH="${PAGES_BASE_PATH:-$REPO_BASE_PATH}"
          [ -n "$BASE_PATH" ] || BASE_PATH="$REPO_BASE_PATH"
          case "$BASE_PATH" in
            */) ;;
            *) BASE_PATH="${BASE_PATH}/" ;;
          esac
          export VITE_BASE_PATH="$BASE_PATH"
          echo "VITE_BASE_PATH=$VITE_BASE_PATH"
          pnpm build

      - name: Enviar artefato para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    name: Publicar site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
